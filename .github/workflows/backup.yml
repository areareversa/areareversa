name: backup do banco

# agenda + botão manual em Actions > backup do banco > Run workflow
on:
  schedule:
    # 3h UTC = meia-noite em Brasília. O cron do GitHub sempre roda em UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      manter:
        description: "Quantos backups manter (padrão 30)"
        required: false
        default: "30"

# O agendamento automático do GitHub só roda em repositórios públicos ou após
# 60 dias de atividade. Este repo é público, então está ok — e o botão manual
# funciona de qualquer forma.
permissions:
  contents: read

concurrency:
  group: backup-banco
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: instalar dependências
        run: npm ci --omit=optional --ignore-scripts
        # --ignore-scripts pula o postinstall "prisma generate", que não é
        # necessário para o dump (só o pacote pg é usado) e evita baixar engine.

      - name: gerar backup
        env:
          # cadastre em Settings > Secrets and variables > Actions > New repository secret
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KEEP: ${{ github.event.inputs.manter || '30' }}
        run: node scripts/backup.mjs --out backups --keep "$KEEP"

      - name: resumo
        run: |
          {
            echo "### Backup do banco — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            ls -lh backups/ | tail -n +2 | awk '{print "- `"$9"` — " $5}'
          } >> "$GITHUB_STEP_SUMMARY"

      # artefato sobrevive a apagar o repositório; 90 dias de retenção
      - name: guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: backup-banco-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error